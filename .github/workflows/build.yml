name: build

# 52 个模块一次全量构建。
# 注意：这里**只做编译/打包**（-DskipTests），不调用任何真实 LLM —— 所有模块都需要
# 外部 API Key（DeepSeek / LiteLLM / Ollama / Postgres），不适合在 CI 里跑。
# 需要真实 LLM 的确定性测试见 embabel-testing（用 mock，无需 Key），可单独加一个 job。
on:
  push:
    branches: [ main ]
    paths:
      - 'ai/embabel/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'ai/embabel/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build-embabel:
    name: Build ai/embabel (52 modules)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show versions
        run: |
          java -version
          mvn -version

      - name: Build all embabel modules
        working-directory: ai/embabel
        run: mvn -B -q package -DskipTests

      - name: Verify module count
        working-directory: ai/embabel
        run: |
          count=$(find . -name '*.jar' -path '*/target/*' ! -name '*.original' | wc -l)
          echo "built jars: $count"
          if [ "$count" -lt 52 ]; then
            echo "::error::expected at least 52 module jars, got $count"
            exit 1
          fi

  test-keyless:
    name: Run keyless tests (no API key needed)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 这些模块的测试都是纯逻辑（分块 / artifact sink / 租户隔离 / mock LLM），不需要 Key
      - name: Run keyless tests
        working-directory: ai/embabel
        run: >
          mvn -B
          -pl :embabel-testing,:embabel-document-ingest,:embabel-tool-chaining,:embabel-identity
          test
