spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:33061}/${MYSQL_DB:distributed_solutions}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  sql:
    init:
      mode: always
      schema-locations: classpath:db/mysql/schema.sql
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai

outbox:
  relay:
    # @Scheduled 仅支持纯数字毫秒或 ISO-8601（PT1S），不支持 1s 简写
    poll-interval: 1000
    batch-size: 50
    max-retries: 5
    initial-backoff: 5s
    backoff-multiplier: 2.0

logging:
  level:
    com.yineng.bpe.distributedsolutions: info
