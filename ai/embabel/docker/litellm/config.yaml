# LiteLLM 代理配置
#
# 为什么需要它：Embabel 的 OpenAI starter 用**同一个 base-url** 访问该 provider 下的
# 所有模型（聊天 + 嵌入）。而 DeepSeek 没有嵌入/视觉能力，本地 Ollama 有但又是另一个服务。
# 用 LiteLLM 把两者统一到一个 OpenAI 兼容端点，应用只需指向 http://localhost:4000。
#
# 应用侧配置（各模块 application.yml）：
#   embabel.agent.platform.models.openai.base-url: http://localhost:4000
#   embabel.agent.platform.models.openai.api-key: sk-1234        # 即 LITELLM_MASTER_KEY
#   模型清单里的 model_id 用下面的 model_name（deepseek-flash / nomic-embed-text / qwen2.5vl:3b）

model_list:
  # ---------- 聊天：转发到 DeepSeek ----------
  - model_name: deepseek-flash
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: deepseek-v4-pro
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY

  # ---------- 嵌入：转发到本地 Ollama ----------
  - model_name: nomic-embed-text
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434

  # ---------- 视觉：转发到本地 Ollama ----------
  - model_name: qwen2.5vl:3b
    litellm_params:
      model: ollama/qwen2.5vl:3b
      api_base: http://ollama:11434

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
