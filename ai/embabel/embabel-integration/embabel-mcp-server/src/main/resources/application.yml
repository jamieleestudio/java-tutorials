server:
  port: 8927

# 本模块把 Embabel Agent 暴露成 **MCP server**（Streamable HTTP 传输，1.5.3 起官方替代已废弃的 SSE）：
#   POST   /mcp   发送 JSON-RPC 请求（初始化/工具调用）
#   GET    /mcp   可选的服务器推送流（SSE 帧）
#   DELETE /mcp   结束会话
# 可用 MCP Inspector / Claude Desktop 等 MCP 客户端连接 http://localhost:8927/mcp
embabel:
  models:
    default-llm: deepseek-flash
  agent:
    platform:
      models:
        openai:
          base-url: ${OPENAI_BASE_URL:placeholder}
          completions: /chat/completions
          api-key: ${DEEPSEEK_API_KEY:placeholder}
