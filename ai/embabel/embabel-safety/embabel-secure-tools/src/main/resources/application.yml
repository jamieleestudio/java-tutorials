server:
  port: 8924

embabel:
  models:
    default-llm: deepseek-flash
  agent:
    platform:
      models:
        openai:
          base-url: ${OPENAI_BASE_URL:placeholder}
          completions: /chat/completions
          api-key: ${DEEPSEEK_API_KEY:placeholder}
      # 护栏触发时快速失败，避免被重试策略拖慢
      action-qos:
        default:
          max-attempts: 1
      llm-operations:
        data-binding:
          max-attempts: 1
