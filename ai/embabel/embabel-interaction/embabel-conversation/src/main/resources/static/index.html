<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Embabel 教程 · 对话与流式（Web UI）</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #262b36;
    --text: #e6e8ee; --muted: #8b93a7; --accent: #5b9dff; --user: #1f2a3d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .muted { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  select, button, textarea {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; outline: none;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #08111f; font-weight: 600; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 10px; max-width: 860px; width: 100%; margin: 0 auto; }
  .row.user { flex-direction: row-reverse; }
  .bubble { padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; word-break: break-word;
            background: var(--panel); border: 1px solid var(--border); max-width: 78%; }
  .row.user .bubble { background: var(--user); border-color: #2d3d57; }
  .who { color: var(--muted); font-size: 12px; align-self: flex-end; padding-bottom: 4px; }
  footer { border-top: 1px solid var(--border); padding: 12px 20px 16px; }
  .composer { display: flex; gap: 10px; max-width: 860px; margin: 0 auto; }
  .composer textarea { flex: 1; resize: none; height: 46px; }
  .hint { max-width: 860px; margin: 8px auto 0; color: var(--muted); font-size: 12px; }
  code { background: #10131a; padding: 1px 5px; border-radius: 4px; color: #9fc4ff; }
</style>
</head>
<body>
<header>
  <h1>对话与流式</h1>
  <span class="muted">模块 <code>embabel-conversation</code> · 端口 8897 · 会话 <code id="sid"></code></span>
  <span class="spacer"></span>
  <select id="persona" title="系统提示词（persona）">
    <option value="">默认人格</option>
    <option value="你是严谨的架构评审者。回答要指出风险、代价与替代方案，用中文。">架构评审者</option>
    <option value="你是耐心的新手导师。用类比和最小示例解释，避免术语堆砌，用中文。">新手导师</option>
  </select>
  <button id="reset">清空会话</button>
</header>

<div id="chat"></div>

<footer>
  <div class="composer">
    <textarea id="input" placeholder="问点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button class="primary" id="send">发送</button>
  </div>
  <div class="hint">
    流式走 <code>GET /chat/{sessionId}/stream</code>（SSE），阻塞式走 <code>POST /chat/{sessionId}</code>，
    两者**共享同一份历史**（<code>ConversationStore</code>）——所以可以先用流式说一句、再用 curl 追问。
  </div>
</footer>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const personaSel = document.getElementById('persona');
const sessionId = 'web-' + Math.random().toString(36).slice(2, 8);
document.getElementById('sid').textContent = sessionId;

function addRow(who, text, cls) {
  const row = document.createElement('div');
  row.className = 'row ' + (cls || '');
  const who_ = document.createElement('div');
  who_.className = 'who';
  who_.textContent = who;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(who_);
  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

addRow('系统', '已连接（sessionId=' + sessionId + '）。回复会流式显示。');

let streaming = false;
function send() {
  const text = input.value.trim();
  if (!text || streaming) return;
  input.value = '';
  addRow('你', text, 'user');

  const bubble = addRow('助手', '', '');
  streaming = true;
  sendBtn.disabled = true;

  const url = '/chat/' + encodeURIComponent(sessionId) + '/stream'
            + '?message=' + encodeURIComponent(text)
            + '&persona=' + encodeURIComponent(personaSel.value);

  const es = new EventSource(url);
  es.onmessage = (e) => {
    // SSE 每个 data: 是一块增量；多行 data 会被规范拼成一条，这里还原 \n
    bubble.textContent += e.data.replace(/\\n/g, '\n');
    chat.scrollTop = chat.scrollHeight;
  };
  es.onerror = () => {
    es.close();
    streaming = false;
    sendBtn.disabled = false;
    if (!bubble.textContent) bubble.textContent = '（连接中断，请检查后端日志与 API Key 配置）';
  };
}

sendBtn.onclick = send;
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById('reset').onclick = async () => {
  await fetch('/chat/' + encodeURIComponent(sessionId) + '/reset', { method: 'POST' });
  chat.innerHTML = '';
  addRow('系统', '会话已清空。');
};
</script>
</body>
</html>
