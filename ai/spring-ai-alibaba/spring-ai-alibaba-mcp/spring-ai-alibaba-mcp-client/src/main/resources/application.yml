server:
  port: 8517

spring:
  application:
    name: spring-ai-alibaba-mcp-client
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
    mcp:
      client:
        enabled: true
        type: SYNC
        # Spring AI 2.0 服务端默认协议即 Streamable HTTP（端点 /mcp，客户端自动拼接）
        streamable-http:
          connections:
            saa-server:
              url: http://localhost:8518
