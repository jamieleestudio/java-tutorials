# Default values — override per environment with -f values-{env}.yaml
replicaCount: 2

image:
  repository: java-tutorials
  tag: "1.0"
  pullPolicy: IfNotPresent

services:
  - name: order-service
    port: 8080
  - name: payment-service
    port: 8080
  - name: product-service
    port: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  className: nginx
  host: ""

config:
  datasourceDriver: org.h2.Driver

env:
  SPRING_DATASOURCE_USERNAME: sa
  SPRING_DATASOURCE_PASSWORD: ""