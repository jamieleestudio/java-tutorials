apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: java-tutorials/cn-order-bootstrap:1.0
          ports:
            - containerPort: 8080
          # 12-Factor: config from the platform
          envFrom:
            - configMapRef:
                name: order-config
            - secretRef:
                name: db-secret
          env:
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service:8080   # K8s Service DNS = service discovery
            - name: PRODUCT_SERVICE_URL
              value: http://product-service:8080
          # K8s probes replace middleware health checks
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: order-service   # this name IS the DNS name other services use
spec:
  selector:
    app: order-service
  ports:
    - port: 8080
      targetPort: 8080