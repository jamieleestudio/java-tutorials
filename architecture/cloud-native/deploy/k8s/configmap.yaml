# ConfigMap replaces the config center — platform-native config management
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-config
data:
  SPRING_DATASOURCE_URL: jdbc:h2:mem:order;DB_CLOSE_DELAY=-1
  SPRING_DATASOURCE_DRIVER: org.h2.Driver
---
