spring:
  application:
    name: order-service
  datasource:
    url: jdbc:h2:mem:order;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

server:
  port: 8081

# ③ Minimal governance: FIXED addresses (no registry yet — ⑤ adds Nacos)
payment:
  service:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8082}

product:
  service:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info