spring:
  application:
    name: api-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
    gateway:
      routes:
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway